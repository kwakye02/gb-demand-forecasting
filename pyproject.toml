[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gb_demand_forecasting"
version = "0.0.1"
description = "An end to end machine learning pipeline for for forecasting Great Briteain electricity demand, imbalance and market signals."
authors = [
  { name = "George" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["gb_demand_forecasting"]
include = ["pyproject.toml", "gb_demand_forecasting/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["gb_demand_forecasting"]
force-sort-within-sections = true
