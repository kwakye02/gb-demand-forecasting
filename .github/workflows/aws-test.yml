name: aws-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload-test:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Upload a test file
        run: |
          echo "hello from github actions" > hello.txt
          aws s3 cp hello.txt s3://gb-demand-forecasting-gk/scores/hello.txt

      - name: Read it back
        run: aws s3 cp s3://gb-demand-forecasting-gk/scores/hello.txt - 